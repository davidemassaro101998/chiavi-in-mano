  .empty{
    text-align:center; padding:44px 20px; background:var(--surface);
    border:1px dashed var(--border-strong); border-radius:var(--r-lg);
  }
  .empty .big{
    width:40px; height:40px; margin:0 auto 12px; border-radius:var(--r-md);
    background:var(--surface-2); display:grid; place-items:center; color:var(--muted-2);
  }
  .empty .ttl{font-weight:600; font-size:14px; color:var(--fg);}
  .empty p{font-size:12.5px; color:var(--muted); margin-top:4px; max-width:40ch; margin-left:auto; margin-right:auto;}
  .empty .azioni{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:16px;}


  /* ------------------------------------------------------------------ */
  /* Menu "Altro" del telefono: le sezioni che non stanno nella barra    */
  /* ------------------------------------------------------------------ */
  .menu-list{display:flex; flex-direction:column;}
  .menu-item{
    display:flex; align-items:center; gap:13px; width:100%;
    padding:15px 4px; background:none; border:none; border-bottom:1px solid var(--border);
    cursor:pointer; text-align:left; color:var(--fg); -webkit-tap-highlight-color:transparent;
    min-height:56px;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:var(--surface-2);}
  .menu-item .ic{
    width:34px; height:34px; flex:none; border-radius:9px; display:grid; place-items:center;
    background:var(--surface-2); color:var(--key);
  }
  .menu-item .tx{flex:1; min-width:0;}
  .menu-item .tx b{display:block; font-size:14.5px; font-weight:600;}
  .menu-item .tx span{display:block; font-size:12px; color:var(--muted-2); margin-top:1px;}
  .menu-item > svg{color:var(--muted-2); flex:none;}
  .menu-item .n{
    font-size:11.5px; font-weight:700; color:#fff; background:var(--bad);
    border-radius:999px; min-width:20px; height:20px; padding:0 6px;
    display:grid; place-items:center; font-variant-numeric:tabular-nums;
  }

  .imp-grid{display:grid; gap:16px; max-width:720px;}
  .imp-body{padding:14px;}
  .imp-body > .field:last-child{margin-bottom:0;}
  .imp-nota{
    font-size:12.5px; color:var(--muted); line-height:1.5;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r-md); padding:11px 12px; margin-bottom:12px;
  }
  .imp-azioni{display:flex; flex-wrap:wrap; gap:8px;}
  .imp-switch{display:flex; align-items:center; gap:11px; font-size:14px; font-weight:500; cursor:pointer; min-height:44px;}
  .imp-azioni .btn{flex:0 1 auto; min-width:150px;}


  /* ------------------------------------------------------------------ */
  /* Ergonomia del telefono                                              */
  /* Il pollice non è un mouse: 44 px è la soglia, e sotto i 16 px iOS   */
  /* ingrandisce la pagina da solo appena tocchi un campo.               */
  /* ------------------------------------------------------------------ */
  @media (max-width:900px){
    input[type="text"],input[type="number"],input[type="date"],input[type="time"],
    input:not([type]),textarea,select{
      font-size:16px; padding:11px 12px; border-radius:var(--r-md);
    }
    input[type="date"],input[type="time"]{min-height:46px;}
    select{padding-right:34px; background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);}
    textarea{min-height:88px;}

    .btn{min-height:44px; padding:10px 15px; font-size:14px;}
    .btn-sm{min-height:40px; padding:8px 12px; font-size:13px;}
    .btn-quiet{min-height:40px;}
    .icon-btn{min-width:40px; min-height:40px;}
    .bell-btn{width:42px; height:42px;}

    .chip-opt{min-height:42px; padding:9px 14px;}
    .fchip{min-height:42px; padding-left:13px; padding-right:13px;}
    .sheet-tab{min-height:44px;}
    .tick{width:22px; height:22px;}
    .search-wrap input{min-height:46px; padding-left:36px;}
  }

  .connecting{display:flex; align-items:center; gap:9px; padding:16px; font-size:13px; color:var(--muted);}
  .dotpulse{width:7px; height:7px; border-radius:999px; background:var(--key-fill); animation:pulsa 1.1s ease-in-out infinite;}

  /* ------------------------------------------------------------------ */
  /* Archivio pieno — non e' un avviso che passa, e' uno stato           */
  /* ------------------------------------------------------------------ */
  .nastro-pieno{
    flex:none; display:flex; align-items:center; gap:12px;
    padding:10px 16px calc(10px + env(safe-area-inset-top)); padding-top:10px;
    background:var(--bad); color:#fff; position:sticky; top:0; z-index:60;
  }
  .nastro-pieno > svg{flex:none;}
  .nastro-pieno div{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .nastro-pieno b{font-size:13px; font-weight:700;}
  .nastro-pieno span{font-size:12px; opacity:.9;}
  .nastro-pieno .btn{flex:none; background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.4); color:#fff;}
  .nastro-pieno .btn:hover{background:rgba(255,255,255,.28);}
  @media (max-width:560px){ .nastro-pieno span{display:none;} }

  /* ------------------------------------------------------------------ */
  /* Barra dello spazio, nella schermata Azienda                         */
  /* ------------------------------------------------------------------ */
  .spazio-barra{
    height:8px; border-radius:999px; background:var(--surface-3);
    overflow:hidden; margin:8px 0 6px;
  }
  .spazio-barra i{display:block; height:100%; background:var(--key-fill); border-radius:999px;
    transition:width .3s var(--ease);}
  .spazio-barra.attenzione i{background:var(--warn);}
  .spazio-barra.pieno i{background:var(--bad);}
  .spazio-righe{display:flex; flex-wrap:wrap; gap:4px 18px; font-size:12px; color:var(--muted);}
  .spazio-righe b{color:var(--fg-2); font-weight:600; font-variant-numeric:tabular-nums;}
  .imp-stato{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:999px; margin-top:2px;
  }
  .imp-stato.si{background:var(--good-tint); color:var(--good);}
  .imp-stato.no{background:var(--warn-tint); color:var(--warn);}
</style>
